include:
  - path: ./services/backend/compose.yaml
  - path: ./apps/frontend/compose.yaml
  - path: ./apps/cli/compose.yaml
  - path: ./clients/agent/compose.yaml

services:
  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - ./infrastructure/local/pgadmin.dev.env
      - path: ./.pgadmin.env
        required: false
    ports:
      - '127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80'
  redis:
    image: 'redis:7'
    env_file:
      - path: ./.redis.env
        required: false
    volumes:
      - type: volume
        source: redisdata
        target: /data
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'

volumes:
  redisdata:
