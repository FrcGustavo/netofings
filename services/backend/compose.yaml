x-backend: &backend
  build:
    context: ../..
    dockerfile: services/backend/Dockerfile
    target: backend-development
  env_file:
    - ./api.dev.env
    - path: ./.env
      required: false
    - ./postgres.dev.env
    - path: ../../.db.env
      required: false
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    PORT: '3000'
  volumes:
    - ./src:/app/services/backend/src

services:
  postgres:
    image: postgres:14
    env_file:
      - ./postgres.dev.env
      - path: ../../.db.env
        required: false
    volumes:
      - type: volume
        source: dbdata
        target: /var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *backend
    command: npm run migrations:run
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000'
      - '127.0.0.1:${MQTT_HOST_PORT:-1883}:1883'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/api").then(response => { if (!response.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  dbdata:
